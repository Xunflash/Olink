<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Olink, Classic: a white tile with the link drawn through Streamline's
       eight accent swatches in hue order (Green, Teal, Blue, Purple, Pink,
       Red, Orange, Amber): whichever colour you pick, it's in there. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="16" x2="0" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f2f7"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="92" y1="0" x2="420" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="0.143" stop-color="#0891b2"/>
      <stop offset="0.286" stop-color="#2563eb"/>
      <stop offset="0.429" stop-color="#7c3aed"/>
      <stop offset="0.571" stop-color="#db2777"/>
      <stop offset="0.714" stop-color="#dc2626"/>
      <stop offset="0.857" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#paper)"/>
  <g transform="rotate(-45 256 256)" fill="none">
    <g stroke="url(#spectrum)" stroke-width="40"><rect x="92" y="196" width="196" height="120" rx="60"/><rect x="224" y="196" width="196" height="120" rx="60"/></g>
  </g>
  <!-- hairline, so the white tile still reads on a light dock -->
  <rect x="16.75" y="16.75" width="478.5" height="478.5" rx="111.25" fill="none"
        stroke="#000000" stroke-opacity="0.10" stroke-width="1.5"/>
</svg>
